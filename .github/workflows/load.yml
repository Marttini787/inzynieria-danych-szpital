name: Load data from Neon to BigQuery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  extract-and-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP service account key to file
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp-key.json

      - name: Run extract and load script
        env:
          NEON_CONNECTION_STRING: ${{ secrets.DATABASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
          BQ_PROJECT_ID: inzynieria-danych-szpital
          BQ_DATASET: raw_data
          BQ_TABLE: pacjenci
        run: python extract_load.py

      - name: Clean up key file
        if: always()
        run: rm -f gcp-key.json
